[project]
name = "equity-research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "luisspanner", email = "spanner.luis@outlook.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.scripts]
equity-research-agent = "equity_research_agent:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9.0,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["src"]
strict = true
